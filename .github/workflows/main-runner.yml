name: Run the main job

on:
  # run the action every 1/2 hour
  schedule:
    - cron: "*/30 * * * *"
  # allow this workflow to be run manually from the Actions tab
  workflow_dispatch:

jobs:
  #keepalive:
    #name: Keep GitHub Actions From Disabling Every 60 Days
    #runs-on: ubuntu-latest
    #permissions:
      #actions: write
    #steps:
      #- uses: actions/checkout@v6
      #- uses: gautamkrishnar/keepalive-workflow@v2
  run:
    runs-on: ubuntu-latest
    steps:
      # git checkout
      - uses: actions/checkout@v6

      # install Node.js
      - uses: actions/setup-node@v6
        with:
          node-version: 18

      # print some debug info to make sure things are working
      - name: Print debug info
        run: |
          pwd
          ls -al
          whoami
          date
          npm --version
          node --version

      # install JS dependencies
      - name: Install dependencies
        run: npm ci

      # download the artifacts from last run
      - run: |
          gh run download -n Results || true
          [ ! -f results.json ] || mv results.json previous-results.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # run the main script
      - name: Run main script
        env:
          SECRET_GMAIL_APP_PASSWORD: ${{ secrets.SECRET_GMAIL_APP_PASSWORD }}
          SECRET_QUOYLES_QUARTERS_DISCORD_WEBHOOK: ${{ secrets.SECRET_QUOYLES_QUARTERS_DISCORD_WEBHOOK }}
          SECRET_EAST_BAY_MAGIC_DISCORD_WEBHOOK: ${{ secrets.SECRET_EAST_BAY_MAGIC_DISCORD_WEBHOOK }}
        run: npm run main

      # upload the new results.
      # NOTE: this MUST run even when the main script fails. main.ts always
      # writes results.json with whatever was successfully sent, but a step
      # with no `if:` defaults to `if: success()`, so a crashed run used to
      # throw that file away. The next run then re-downloaded the older
      # artifact and sent every one of those cards again. See issue #8
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Results
          path: results.json
